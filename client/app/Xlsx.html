<script>
  /* ══════════════════════════════════════════════════════════════
     XUẤT XLSX — tự viết, không thư viện ngoài
     ══════════════════════════════════════════════════════════════
     xlsxBuild(sheetName, headers, rows) -> Uint8Array (file .xlsx, 1 sheet)
     downloadBlob(filename, blob)        -> tải một Blob xuống máy

     • MỌI ô là chữ nội tuyến (t="inlineStr"), không bao giờ là số hay công thức:
       số thuê bao "0902343108" giữ số 0 đầu, "=HYPERLINK(..)" chỉ là chữ, không chạy.
     • Hàng tiêu đề in đậm (style s="1").
     • Gói zip kiểu "stored" (không nén): bản ghi cục bộ + central directory + CRC32 bảng tra.
     ══════════════════════════════════════════════════════════════ */

  /* ---------- tải Blob xuống (dùng chung cho CSV và XLSX) ---------- */
  function downloadBlob(filename, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  /* ---------- CRC32 ---------- */
  let XLSX_CRC_TABLE = null;
  function xlsxCrc32(bytes) {
    if (!XLSX_CRC_TABLE) {
      XLSX_CRC_TABLE = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        XLSX_CRC_TABLE[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) crc = XLSX_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  /* ---------- zip "stored": files = [{name, data(Uint8Array)}] ---------- */
  function xlsxZip(files) {
    const enc = new TextEncoder();
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((Math.max(now.getFullYear(), 1980) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const parts = [], central = [];
    let offset = 0;

    files.forEach(function (f) {
      const name = enc.encode(f.name);
      const crc = xlsxCrc32(f.data);
      const size = f.data.length;

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);          // version needed
      lh.setUint16(6, 0x0800, true);      // bit 11: tên file UTF-8
      lh.setUint16(8, 0, true);           // method 0 = stored
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true);
      lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true);
      lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, f.data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);          // version made by
      ch.setUint16(6, 20, true);          // version needed
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true);
      ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);

      offset += 30 + name.length + size;
    });

    let centralSize = 0;
    central.forEach(function (c) { centralSize += c.length; });
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);

    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    let total = 0;
    all.forEach(function (p) { total += p.length; });
    const out = new Uint8Array(total);
    let pos = 0;
    all.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  /* ---------- XML ---------- */
  /** Bỏ ký tự cấm trong XML 1.0 (điều khiển trừ tab/LF/CR, surrogate lẻ, U+FFFE/U+FFFF), chuẩn hoá xuống dòng, rồi escape &, <, >.
   *  attr=true: escape thêm dấu " (dùng cho giá trị thuộc tính). */
  function xlsxEsc(v, attr) {
    const s = String(v == null ? '' : v).replace(/\r\n?/g, '\n');
    let out = '';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c < 0x20 && c !== 9 && c !== 10) continue;                       // điều khiển cấm
      if (c === 0xFFFE || c === 0xFFFF) continue;
      if (c >= 0xD800 && c <= 0xDBFF) {                                    // cặp surrogate hợp lệ thì giữ, lẻ thì bỏ
        const d = s.charCodeAt(i + 1);
        if (d >= 0xDC00 && d <= 0xDFFF) { out += s.charAt(i) + s.charAt(i + 1); i++; }
        continue;
      }
      if (c >= 0xDC00 && c <= 0xDFFF) continue;
      out += s.charAt(i);
    }
    out = out.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return attr ? out.replace(/"/g, '&quot;') : out;
  }

  /** 0 -> A, 25 -> Z, 26 -> AA, 701 -> ZZ, 702 -> AAA */
  function xlsxColName(i) {
    let s = '';
    for (i = i + 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
    return s;
  }

  /** Tên sheet Excel: bỏ []:*?/\, không bắt đầu/kết thúc bằng dấu ', tối đa 31 ký tự, rỗng -> Sheet1. */
  function xlsxSheetName(name) {
    let s = String(name == null ? '' : name)
      .replace(/[\u0000-\u001F]/g, '').replace(/[\[\]:*?\/\\]/g, '').trim()
      .replace(/^'+|'+$/g, '');
    s = Array.from(s).slice(0, 31).join('').replace(/^'+|'+$/g, '').trim();
    return s || 'Sheet1';
  }

  function xlsxCell(ref, text, style) {
    return '<c r="' + ref + '"' + (style ? ' s="' + style + '"' : '') + ' t="inlineStr"><is><t xml:space="preserve">' + xlsxEsc(text) + '</t></is></c>';
  }

  const XLSX_DECL = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

  function xlsxBuild(sheetName, headers, rows) {
    headers = headers || [];
    rows = rows || [];
    const ncol = Math.max(headers.length, rows.reduce(function (m, r) { return Math.max(m, (r || []).length); }, 0));

    /* độ rộng cột theo nội dung dài nhất (5..60 ký tự) */
    const widths = [];
    for (let c = 0; c < ncol; c++) {
      let w = String(headers[c] == null ? '' : headers[c]).length;
      rows.forEach(function (r) { w = Math.max(w, String(r && r[c] != null ? r[c] : '').length); });
      widths.push(Math.min(60, Math.max(8, Math.ceil(w * 1.15) + 2)));
    }

    let sheetData = '';
    if (headers.length) {
      sheetData += '<row r="1">' + headers.map(function (h, c) { return xlsxCell(xlsxColName(c) + '1', h, 1); }).join('') + '</row>';
    }
    const first = headers.length ? 2 : 1;
    rows.forEach(function (r, i) {
      const n = first + i;
      let cells = '';
      for (let c = 0; c < ncol; c++) cells += xlsxCell(xlsxColName(c) + n, r ? r[c] : '', 0);
      sheetData += '<row r="' + n + '">' + cells + '</row>';
    });

    const sheetXml = XLSX_DECL +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      (ncol ? '<cols>' + widths.map(function (w, c) {
        return '<col min="' + (c + 1) + '" max="' + (c + 1) + '" width="' + w + '" customWidth="1"/>';
      }).join('') + '</cols>' : '') +
      '<sheetData>' + sheetData + '</sheetData></worksheet>';

    const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const NS_PR = 'http://schemas.openxmlformats.org/package/2006/relationships';

    const contentTypes = XLSX_DECL +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';

    const rootRels = XLSX_DECL +
      '<Relationships xmlns="' + NS_PR + '">' +
      '<Relationship Id="rId1" Type="' + NS_R + '/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';

    const workbook = XLSX_DECL +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="' + NS_R + '">' +
      '<sheets><sheet name="' + xlsxEsc(xlsxSheetName(sheetName), true) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';

    const workbookRels = XLSX_DECL +
      '<Relationships xmlns="' + NS_PR + '">' +
      '<Relationship Id="rId1" Type="' + NS_R + '/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="' + NS_R + '/styles" Target="styles.xml"/>' +
      '</Relationships>';

    /* s=0: mặc định; s=1: chữ đậm (hàng tiêu đề) */
    const styles = XLSX_DECL +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2">' +
        '<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
      '</fonts>' +
      '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="2">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';

    const enc = new TextEncoder();
    return xlsxZip([
      { name: '[Content_Types].xml',        data: enc.encode(contentTypes) },
      { name: '_rels/.rels',                data: enc.encode(rootRels) },
      { name: 'xl/workbook.xml',            data: enc.encode(workbook) },
      { name: 'xl/_rels/workbook.xml.rels', data: enc.encode(workbookRels) },
      { name: 'xl/worksheets/sheet1.xml',   data: enc.encode(sheetXml) },
      { name: 'xl/styles.xml',              data: enc.encode(styles) }
    ]);
  }
</script>
