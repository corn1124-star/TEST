  /* ══════════════════════════════════════════════════════════════
     ĐỘNG CƠ DỊCH
     ══════════════════════════════════════════════════════════════ */

  let LANG = 'vi';

  /**
   * Lấy chuỗi đã dịch. {placeholder} được thay bằng giá trị trong vars.
   * Không tìm thấy key -> trả về chính key để lộ ra ngay khi thiếu chuỗi.
   */
  function t(key, vars) {
    let s = (I18N[LANG] && I18N[LANG][key]) || (I18N.vi[key]) || key;

    if (vars) {
      Object.keys(vars).forEach(function (k) {
        s = s.split('{' + k + '}').join(String(vars[k]));
      });
    }
    return s;
  }

  /** Quét DOM, áp dụng toàn bộ chuỗi theo LANG hiện tại. */
  function applyI18n() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.innerHTML = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
      el.placeholder = t(el.getAttribute('data-i18n-ph'));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
      el.title = t(el.getAttribute('data-i18n-title'));
    });

    // Tooltip sidebar ở chế độ rail
    document.querySelectorAll('[data-tip-key]').forEach(function (el) {
      el.setAttribute('data-tip', t(el.getAttribute('data-tip-key')));
    });

    setText('langLabel', t('lang.current'));
    const lb = el('langBtn');
    if (lb) lb.title = t('lang.switch');

    document.title = t('app.name');
  }
</script>
