<style>
  /* Hallmark · v2.0.0 · shape: app screen · genre: modern-minimal · theme: custom · brand: Grab (spec 2026-11-06, from grab.com; Inter + Roboto Mono, both with Vietnamese) · redesign: full
   * nav: top bar of four underlined tabs, bottom bar under 860px · signature: 30-day receipts and issues line chart with the stock-health bar beside it · states: loading, empty, full
   * axes: light/grotesk-sans/warm · posture: restrained · contrast: pass */
  /* Hallmark · answered F7 · one card and control recipe (hairline, 6 to 8px radius, no shadow) is the point of this system, so the ledger, forms and tables read as one surface */
  /* Hallmark · answered F24 · .noti-box is a floating notification panel over the table; the hairline keeps its edge on pale paper and the shadow (blur 20px) only lifts it */
  /* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: E, only the dashboard is recomposed so far and the other screens carry the new system on their old layouts; next batches recompose them */
  /* ============================================================
     STYLES.HTML — DESIGN SYSTEM · Grab Inventory Management
     LƯU Ý: Theme.html nạp sau và GHI ĐÈ token ở :root (xanh Grab, cỡ chữ 15px, header 60px). Giá trị đúng là của Theme.html; xem DESIGN.md.
     ============================================================
     NGUYÊN TẮC:
     1. TYPOGRAPHY — thang 6 cấp (11/12/13/14/16/20px), 3 độ đậm (400/500/600)
     2. SPACING    — lưới 4px: 4·8·12·16·20·24·32·40
     3. MÀU        — TRUNG TÍNH là chủ đạo. Xanh Grab CHỈ dùng 3 chỗ:
                       nút chính · viền focus · menu active
                     KHÔNG dùng xanh cho tiêu đề, nền lớn, panel, badge.
                     Panel Asset Code dùng nền ĐEN thay vì xanh.
     4. SIDEBAR    — 2 chế độ: full 236px / rail 64px (chỉ icon + tooltip)
     5. LAYOUT     — min-width chặt để bảng không tràn, wrap có kiểm soát

     [hidden] có !important -> chốt cuối chặn phần tử tự hiện.
     ============================================================ */

  :root{
    /* ── XANH GRAB — chỉ 3 chỗ: nút chính · focus · menu active ── */
    --g-500:#00b14f;
    --g-600:#019345;
    --g-700:#03713a;
    --g-050:#f2f8f4;   /* nền menu active, rất nhạt */
    --g-100:#dceee4;

    /* ── MÀU TRẠNG THÁI — chỉ cho badge và hộp thông báo ── */
    --blue:#1d4ed8;    --blue-bg:#eef3fe;   --blue-bd:#d5e0fb;
    --amber:#b45309;   --amber-bg:#fdf6e7;  --amber-bd:#f3e3bd;
    --red:#c62828;     --red-bg:#fdeeee;    --red-bd:#f5cdcd;
    --violet:#455a4f;  --violet-bg:#e9efeb; --violet-bd:#c3d0c8;

    /* ── XÁM TRUNG TÍNH — xương sống giao diện ── */
    --n-000:#fcfefd;  --n-025:#f8fbf9;  --n-050:#f7f8fa;
    --n-100:#f1f3f6;  --n-200:#e5e8ed;  --n-300:#d3d8e0;
    --n-400:#9aa3b0;  --n-500:#6b7480;  --n-600:#4d5561;
    --n-700:#343b45;  --n-900:#1a1f26;

    /* ── TYPOGRAPHY ── */
    --fs-xs:11px;    --fs-sm:12px;    --fs-md:13px;
    --fs-base:14px;  --fs-lg:16px;    --fs-xl:20px;  --fs-num:24px;
    --lh-xs:1.45;    --lh-sm:1.5;     --lh-md:1.55;
    --lh-base:1.6;   --lh-lg:1.4;     --lh-xl:1.3;
    --fw-normal:400; --fw-medium:500; --fw-semi:600;

    /* ── SPACING (lưới 4px) ── */
    --s-1:4px;  --s-2:8px;  --s-3:12px; --s-4:16px;
    --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px;

    /* ── HÌNH KHỐI ── */
    --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:14px;
    --sh-sm:0 1px 2px rgba(26,31,38,.05);
    --sh-md:0 4px 12px rgba(26,31,38,.08);
    --sh-lg:0 10px 32px rgba(26,31,38,.12);

    /* ── LAYOUT ── */
    --sb-full:236px; --sb-rail:64px; --hd-h:56px; --ico:18px;
  }

  *{ box-sizing:border-box; }

  html, body{
    height:100%; margin:0;
    font-family:var(--font-body);
    font-size:var(--fs-base); line-height:var(--lh-base);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    background:var(--n-050); color:var(--n-900);
  }

  [hidden]{ display:none !important; }

  /* ══════════════════════════════════════════════════════
     ICON — mọi <svg aria-hidden="true" class="ico"> dùng chung
     ══════════════════════════════════════════════════════ */
  .ico{ width:var(--ico); height:var(--ico); flex-shrink:0; display:block; }
  .ico-sm{ width:15px; height:15px; }
  .ico-lg{ width:22px; height:22px; }
  .ico-xl{ width:28px; height:28px; }

  /* ══════════════════════════════════════════════════════
     LAYOUT GỐC
     ══════════════════════════════════════════════════════ */
  .layout{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  /* ══════════════════════════════════════════════════════
     SIDEBAR — 2 CHẾ ĐỘ
       mặc định : full 236px, icon + chữ
       .rail    : rail  64px, CHỈ icon, canh giữa, có tooltip
     ══════════════════════════════════════════════════════ */
  .sidebar{
    width:var(--sb-full); flex-shrink:0;
    display:flex; flex-direction:column; overflow:hidden;
    background:var(--n-000); border-right:1px solid var(--n-200);
  }
  .sidebar.rail{ width:var(--sb-rail); }

  .sidebar.rail .nav-txt,
  .sidebar.rail .nav-group,
  .sidebar.rail .brand-txt,
  .sidebar.rail .sb-foot{ display:none; }

  /* ── LOGO ẢNH ──
     Ảnh nguồn là JPG nền trắng CÓ VIỀN TRẮNG bao quanh, nên:
       object-fit:contain -> không méo
       object-position:left center -> ghim mép trái, viền trắng không đẩy lệch
       overflow:hidden ở .brand -> ảnh không tràn khỏi vùng 56px
     LƯU Ý: ĐỔI KÍCH THƯỚC: sửa height ở .brand-logo (.land-logo nằm trong Theme.html)
     LƯU Ý: ĐỔI ẢNH: sửa src ở 2 chỗ trong Index.html */
  .brand{
    height:var(--hd-h); flex-shrink:0;
    display:flex; align-items:center; gap:var(--s-3);
    padding:0 var(--s-4); border-bottom:1px solid var(--n-200);
    overflow:hidden;
  }

  .brand-logo{
    height:24px; width:auto; max-width:88px; flex-shrink:0;
    display:block;
    object-fit:contain; object-position:left center;
  }

  .sidebar.rail .brand{ justify-content:center; padding:0 var(--s-2); }
  .sidebar.rail .brand-logo{
    height:22px; max-width:44px; object-position:center center;
  }

  .brand-txt{ min-width:0; }
  .brand-name{
    font-size:var(--fs-md); font-weight:var(--fw-semi); line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-sub{
    font-size:11px; color:var(--n-400); line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ── Menu ── */
  .nav{ flex:1; padding:var(--s-3) var(--s-2); overflow-y:auto; overflow-x:hidden; }

  .nav-group{
    padding:var(--s-4) var(--s-3) var(--s-2);
    font-size:11px; font-weight:var(--fw-semi); color:var(--n-400);
  }

  .nav-item{
    position:relative;
    display:flex; align-items:center; gap:var(--s-3);
    height:38px; padding:0 var(--s-3); margin-bottom:2px;
    border-radius:var(--r-md);
    font-size:var(--fs-md); font-weight:var(--fw-medium);
    color:var(--n-600); white-space:nowrap; cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .nav-item:hover{ background:var(--n-100); color:var(--n-900); }

  /* Trạng thái active — 1 trong 3 chỗ dùng xanh Grab */
  .nav-item.active{
    background:var(--g-050); color:var(--g-700); font-weight:var(--fw-semi);
  }
  .nav-item.active::before{
    content:''; position:absolute; left:0; top:9px; bottom:9px;
    width:3px; border-radius:0 2px 2px 0; background:var(--color-board);
  }

  .sidebar.rail .nav-item{ justify-content:center; padding:0; }
  .sidebar.rail .nav-item.active::before{ left:-8px; }

  /* Tooltip chỉ hiện ở chế độ rail */
  .sidebar.rail .nav-item::after{
    content:attr(data-tip);
    position:absolute; left:calc(100% + 10px); top:50%;
    transform:translateY(-50%) translateX(-4px);
    padding:4px var(--s-2); border-radius:var(--r-sm);
    background:var(--n-900); color:var(--n-000);
    font-size:var(--fs-xs); font-weight:var(--fw-medium);
    white-space:nowrap; pointer-events:none; opacity:0; z-index:80;
    transition:opacity .14s ease, transform .14s ease;
  }
  .sidebar.rail .nav-item:hover::after{ opacity:1; transform:translateY(-50%) translateX(0); }

  .nav-badge{
    margin-left:auto; min-width:18px; height:18px; padding:0 4px;
    display:flex; align-items:center; justify-content:center;
    border-radius:999px; background:var(--red); color:var(--n-000);
    font-size:11px; font-weight:var(--fw-semi); line-height:1;
  }
  .sidebar.rail .nav-badge{
    position:absolute; top:4px; right:6px; margin:0;
    min-width:15px; height:15px; padding:0 4px; font-size:11px;
  }

  .sb-foot{ padding:var(--s-3); border-top:1px solid var(--n-200); }
  .sb-chip{
    padding:var(--s-2) var(--s-3); border-radius:var(--r-md);
    background:var(--n-050); color:var(--n-500);
    font-size:var(--fs-xs); font-weight:var(--fw-medium);
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ══════════════════════════════════════════════════════
     HEADER — 3 vùng: điều hướng · tìm kiếm · công cụ + danh tính
     ══════════════════════════════════════════════════════ */
  .header{
    height:var(--hd-h); flex-shrink:0;
    display:flex; align-items:center; gap:var(--s-3);
    padding:0 var(--s-5);
    background:var(--n-000); border-bottom:1px solid var(--n-200);
  }

  .icon-btn{
    position:relative;
    width:32px; height:32px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:var(--r-md); background:transparent;
    color:var(--n-500); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .icon-btn:hover{ background:var(--n-100); color:var(--n-900); }

  .crumb{
    min-width:0; max-width:230px; padding-right:var(--s-3);
    border-right:1px solid var(--n-200);
  }
  .crumb-page{
    font-size:var(--fs-md); font-weight:var(--fw-semi); line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .crumb-scope{
    font-size:11px; color:var(--n-400); line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ô tìm kiếm đặt ngay trên bảng cần tìm (.sec-head, .filters) */
  .search{ position:relative; flex:1 1 220px; max-width:360px; min-width:0; }
  .search-ico{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--n-400); pointer-events:none;
  }
  .search-ico .ico{ width:15px; height:15px; }
  .search input{
    width:100%; height:34px; padding:0 32px;
    border:1px solid var(--n-200); border-radius:var(--r-md);
    background:var(--n-050);
    font-size:var(--fs-md); font-family:inherit; color:var(--n-900); outline:none;
    transition:background .14s ease, border-color .14s ease;
  }
  .search input::placeholder{ color:var(--n-400); }
  .search input:focus{ background:var(--n-000); }
  .search-clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    border:none; border-radius:var(--r-sm); background:none;
    color:var(--n-400); cursor:pointer;
  }
  .search-clear:hover{ background:var(--n-100); color:var(--n-700); }

  .header-right{ margin-left:auto; display:flex; align-items:center; gap:var(--s-1); }
  .tool-group{ display:flex; align-items:center; gap:2px; }

  .hd-divider{
    width:1px; height:22px; margin:0 var(--s-2);
    background:var(--n-200); flex-shrink:0;
  }

  .lang-btn{
    display:flex; align-items:center; gap:var(--s-1);
    height:32px; padding:0 var(--s-2);
    border:1px solid var(--n-200); border-radius:var(--r-md);
    background:var(--n-000); color:var(--n-600);
    font-size:var(--fs-xs); font-family:inherit; font-weight:var(--fw-semi);
    cursor:pointer; transition:border-color .14s ease, color .14s ease;
  }
  .lang-btn:hover{ border-color:var(--n-300); color:var(--n-900); }
  .lang-btn .ico{ width:15px; height:15px; }

  /* ── Menu user ── */
  .user-menu{
    position:relative; display:flex; align-items:center; gap:var(--s-2);
    height:36px; padding:0 var(--s-2); border-radius:var(--r-md);
    cursor:pointer; transition:background .14s ease;
  }
  .user-menu:hover{ background:var(--n-100); }

  .avatar{
    width:28px; height:28px; flex-shrink:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--n-700); color:var(--n-000);
    font-size:var(--fs-xs); font-weight:var(--fw-semi);
  }
  .user-text{ min-width:0; max-width:130px; }
  .user-name{
    font-size:var(--fs-sm); font-weight:var(--fw-semi); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .user-cc{ font-size:11px; color:var(--n-400); line-height:1.35; }
  .user-menu > .ico{ width:14px; height:14px; color:var(--n-400); }

  .user-box{
    display:none; position:absolute; right:0; top:42px; z-index:60;
    width:280px; padding:var(--s-4);
    background:var(--n-000); border:1px solid var(--n-200); border-radius:var(--r-lg);
    box-shadow:var(--sh-md); cursor:default;
  }
  .user-box.open{ display:block; }
  .ub-head{ padding-bottom:var(--s-3); border-bottom:1px solid var(--n-200); }
  .ub-name{ font-size:var(--fs-md); font-weight:var(--fw-semi); }
  .ub-mail{ font-size:var(--fs-sm); color:var(--n-500); word-break:break-all; }
  .ub-row{
    display:flex; justify-content:space-between; gap:var(--s-3);
    padding:var(--s-2) 0; font-size:var(--fs-sm);
  }
  .ub-row span{ flex-shrink:0; color:var(--n-500); }
  .ub-row b{ text-align:right; font-weight:var(--fw-medium); }

  /* ══════════════════════════════════════════════════════
     CHUÔNG THÔNG BÁO — nơi DUY NHẤT đọc thông báo
     ══════════════════════════════════════════════════════
     Trước đây thông báo hiện ở CẢ chuông và trang Của tôi. Bản này gom về
     chuông vì chuông dùng được ở mọi trang, không phải đổi trang mới đọc.
     ══════════════════════════════════════════════════════ */
  .noti-wrap{ position:relative; }

  .noti-dot{
    position:absolute; top:2px; right:2px;
    min-width:15px; height:15px; padding:0 4px;
    display:flex; align-items:center; justify-content:center; border-radius:8px;
    background:var(--red); color:var(--n-000);
    font-size:11px; font-weight:var(--fw-semi); line-height:1;
    box-shadow:0 0 0 2px var(--n-000);
  }
  .noti-ring{ animation:ring .55s ease; }
  @keyframes ring{
    0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)}
  }

  .noti-box{
    display:none; position:absolute; right:0; top:42px; z-index:65;
    width:400px; max-width:calc(100vw - 32px); max-height:78vh;
    flex-direction:column; overflow:hidden;
    background:var(--n-000); border:1px solid var(--n-200); border-radius:var(--r-lg);
    box-shadow:var(--sh-lg);
  }
  .noti-box.open{ display:flex; }

  .noti-head{
    display:flex; align-items:center; gap:var(--s-2);
    padding:var(--s-3) var(--s-4); border-bottom:1px solid var(--n-200);
  }
  .noti-title{ flex:1; font-size:var(--fs-md); font-weight:var(--fw-semi); }
  .noti-count{
    margin-left:var(--s-2); font-size:var(--fs-xs);
    font-weight:var(--fw-normal); color:var(--n-400);
  }

  .noti-tabs{
    display:flex; padding:var(--s-2) var(--s-4);
    border-bottom:1px solid var(--n-200); background:var(--n-025);
  }

  .noti-list{ flex:1; max-height:400px; overflow-y:auto; }
  .noti-item{
    display:flex; gap:var(--s-3);
    padding:var(--s-3) var(--s-4); border-bottom:1px solid var(--n-100);
  }
  .noti-item:last-child{ border-bottom:none; }
  /* Chưa đọc: dải xám bên trái, KHÔNG tô nền xanh */
  .noti-item.unread{ background:var(--n-050); box-shadow:inset 2px 0 0 var(--n-700); }
  .noti-body{ flex:1; min-width:0; }
  .noti-msg{ font-size:var(--fs-md); line-height:var(--lh-md); word-break:break-word; }
  .noti-meta{
    margin-top:var(--s-1); display:flex; gap:var(--s-2); flex-wrap:wrap; align-items:center;
    font-size:var(--fs-xs); color:var(--n-400);
  }
  .noti-empty{
    padding:var(--s-8) var(--s-4); text-align:center;
    font-size:var(--fs-md); color:var(--n-400);
  }

  .noti-check{
    width:20px; height:20px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--n-300); border-radius:var(--r-sm);
    background:var(--n-000); color:transparent; cursor:pointer;
    transition:border-color .14s ease, background .14s ease, color .14s ease;
  }
  .noti-check .ico{ width:12px; height:12px; }
  .noti-check:hover{ border-color:var(--n-700); color:var(--n-700); }
  .noti-check.done{
    border-color:var(--n-400); background:var(--n-400);
    color:var(--n-000); cursor:default;
  }

  .noti-cta{
    flex-shrink:0; width:100%;
    display:flex; align-items:center; gap:var(--s-2);
    padding:var(--s-3) var(--s-4);
    border:none; border-top:1px solid var(--n-200); background:var(--n-100);
    color:var(--n-700); font-size:var(--fs-md); font-family:inherit;
    font-weight:var(--fw-semi); text-align:left; cursor:pointer;
  }
  .noti-cta:hover{ background:var(--n-200); }
  .noti-cta .num{
    min-width:18px; height:18px; padding:0 4px;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:999px; background:var(--red); color:var(--n-000); font-size:11px;
  }
  .noti-cta .ico{ margin-left:auto; width:15px; height:15px; }

  /* ══════════════════════════════════════════════════════
     NỘI DUNG & TRANG
     ══════════════════════════════════════════════════════ */
  .content{ flex:1; overflow-y:auto; padding:var(--s-6) var(--s-6) var(--s-10); }
  .page{ display:none; }
  .page.active{ display:block; }

  .page-title{
    margin:0 0 var(--s-1);
    font-size:var(--fs-xl); line-height:var(--lh-xl);
    font-weight:var(--fw-semi); letter-spacing:-.3px;
  }
  .page-sub{ margin:0 0 var(--s-6); font-size:var(--fs-md); color:var(--n-500); }

  .sec-title{
    margin:0 0 var(--s-3);
    font-size:var(--fs-lg); line-height:var(--lh-lg); font-weight:var(--fw-semi);
  }

  .card{
    margin-bottom:var(--s-5); padding:var(--s-5);
    background:var(--n-000); border:1px solid var(--n-200);
    border-radius:var(--r-lg);
  }

  .sec{ margin-bottom:var(--s-8); }
  .sec:last-child{ margin-bottom:0; }

  .sec-head{
    display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap;
    margin-bottom:var(--s-3);
  }
  .sec-head .sec-title{ margin:0; flex:1; min-width:150px; }

  .sec-count{
    display:inline-flex; min-width:20px; height:20px; padding:0 var(--s-2);
    align-items:center; justify-content:center; margin-left:var(--s-2);
    border-radius:10px; background:var(--red); color:var(--n-000);
    font-size:var(--fs-xs); font-weight:var(--fw-semi);
  }

  .hint{
    margin-top:var(--s-2); font-size:var(--fs-sm);
    color:var(--n-500); line-height:var(--lh-sm);
  }

  /* ══════════════════════════════════════════════════════
     HỘP THÔNG BÁO
     ══════════════════════════════════════════════════════ */
  .box{
    margin:var(--s-3) 0; padding:var(--s-3) var(--s-4);
    border-radius:var(--r-md); border:1px solid transparent;
    font-size:var(--fs-md); line-height:var(--lh-md);
  }
  .box b{ font-weight:var(--fw-semi); }
  .box.info{ background:var(--n-050); border-color:var(--n-200); color:var(--n-600); }
  .box.err{ background:var(--red-bg); border-color:var(--red-bd); color:var(--red); }
  /* Thành công: xám đậm, KHÔNG xanh — tránh lạm dụng màu thương hiệu */
  .box.ok{ background:var(--n-100); border-color:var(--n-300); color:var(--n-700); }

  .role-note{
    margin-top:var(--s-4); padding:var(--s-3) var(--s-4);
    border-radius:var(--r-md); border:1px solid var(--n-300);
    background:var(--n-050); color:var(--n-600);
    font-size:var(--fs-sm); line-height:var(--lh-sm);
  }

  /* ══════════════════════════════════════════════════════
     NÚT
     ══════════════════════════════════════════════════════ */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:var(--s-2);
    height:36px; padding:0 var(--s-4);
    border:1px solid transparent; border-radius:var(--r-md);
    background:var(--g-600); color:var(--n-000);
    font-size:var(--fs-md); font-family:inherit; font-weight:var(--fw-semi);
    white-space:nowrap; cursor:pointer;
    transition:background .14s ease, border-color .14s ease, color .14s ease;
  }
  .btn:hover{ background:var(--g-700); }
  .btn:active{ background:var(--g-700); }
  .btn:disabled{ background:var(--n-200); color:var(--n-500); cursor:default; }
  .btn .ico{ width:15px; height:15px; }

  .btn.ghost{ background:var(--n-000); border-color:var(--n-200); color:var(--n-700); }
  .btn.ghost:hover{ background:var(--n-050); border-color:var(--n-300); }
  .btn.ghost:disabled{ background:var(--n-050); color:var(--n-400); border-color:var(--n-200); }

  .btn.sm{ height:29px; padding:0 var(--s-3); font-size:var(--fs-xs); gap:var(--s-1); }
  .btn.sm .ico{ width:13px; height:13px; }

  .btn.danger{ color:var(--red); }
  .btn.danger:hover{ background:var(--red-bg); border-color:var(--red-bd); }

  /* ══════════════════════════════════════════════════════
     BIỂU MẪU
     ══════════════════════════════════════════════════════ */
  .grid{ display:flex; gap:var(--s-4); flex-wrap:wrap; }
  .grid + .grid{ margin-top:var(--s-3); }

  .field{ flex:1 1 180px; min-width:160px; }
  .field.w-sm{ flex:0 1 150px; max-width:170px; }
  .field.w-md{ flex:0 1 190px; max-width:210px; }
  .field.w-full{ flex:1 1 100%; max-width:none; }          /* hàng riêng, vd ô tìm kiếm ở đầu bộ lọc */
  .field.w-full .search{ max-width:none; }

  label{
    display:block; margin-bottom:var(--s-1);
    font-size:var(--fs-sm); font-weight:var(--fw-medium); color:var(--n-600);
  }

  input, select{
    width:100%; height:36px; padding:0 var(--s-3);
    border:1px solid var(--n-300); border-radius:var(--r-md); background:var(--n-000);
    font-size:var(--fs-md); font-family:inherit; color:var(--n-900); outline:none;
    transition:border-color .14s ease, box-shadow .14s ease;
  }
  input::placeholder{ color:var(--n-400); }
  input:disabled, select:disabled{
    background:var(--n-050); color:var(--n-400); cursor:not-allowed;
  }

  /* Ô bắt buộc — nhấn bằng viền xám đậm, KHÔNG tô nền màu */
  .field.emphasis{
    padding:var(--s-3); border:1px solid var(--n-300);
    border-radius:var(--r-md); background:var(--n-050);
  }
  .field.emphasis > label{ color:var(--n-700); font-weight:var(--fw-semi); }

  .hd-select, .hd-input{
    width:auto; height:29px; padding:0 var(--s-2);
    font-size:var(--fs-xs); color:var(--n-600);
    border-color:var(--n-200); background:var(--n-000);
  }
  .hd-select{ min-width:130px; max-width:170px; flex-shrink:0; }
  .hd-input{ min-width:150px; max-width:220px; flex-shrink:1; }

  /* ══════════════════════════════════════════════════════
     FORM 4 BƯỚC — trình tự nghiệp vụ nhập kho
     ══════════════════════════════════════════════════════
     Form cũ dàn 14 ô ngang 4 hàng, người dùng không biết ô nào ảnh hưởng
     Asset Code, ô nào chỉ là thông tin kèm. Chia bước làm rõ nhân quả:
       B1 định danh -> sinh mã   B2 số lượng & thùng
       B3 thời gian & vị trí     B4 chứng từ
     ══════════════════════════════════════════════════════ */
  .fstep{
    padding-bottom:var(--s-5); margin-bottom:var(--s-5);
    border-bottom:1px solid var(--n-200);
  }
  .fstep.last{ padding-bottom:0; margin-bottom:0; border-bottom:none; }

  .fstep-head{
    display:flex; align-items:flex-start; gap:var(--s-3);
    margin-bottom:var(--s-4);
  }

  .fstep-no{
    width:24px; height:24px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--n-700); color:var(--n-000);
    font-size:var(--fs-sm); font-weight:var(--fw-semi); line-height:1;
  }

  .fstep-txt{ min-width:0; }
  .fstep-title{
    font-size:var(--fs-base); font-weight:var(--fw-semi);
    line-height:1.35; color:var(--n-900);
  }
  .fstep-sub{
    margin-top:0px; font-size:var(--fs-sm);
    line-height:var(--lh-sm); color:var(--n-500);
  }

  /* ── Panel Asset Code — nền ĐEN, không xanh ── */
  .code-panel{
    display:flex; align-items:center; gap:var(--s-4);
    margin-top:var(--s-4); padding:var(--s-4) var(--s-5);
    border-radius:var(--r-lg); background:var(--n-900); color:var(--n-000);
  }
  .code-left{ flex:1; min-width:0; }
  .code-label{
    font-size:11px; font-weight:var(--fw-semi); color:var(--n-400);
  }
  .code-value{
    margin-top:var(--s-1);
    font-family:var(--font-mono);
    font-size:var(--fs-lg); font-weight:var(--fw-semi);
    color:var(--n-000); word-break:break-all; line-height:1.35;
  }
  .code-note{
    margin-top:var(--s-1); font-size:var(--fs-sm);
    color:var(--n-300); line-height:var(--lh-sm);
  }
  .code-panel > .ico{ width:20px; height:20px; color:var(--n-500); }

  /* ── Bảng giải nghĩa 6 phân đoạn Asset Code ──
     Mỗi ô = 1 phân đoạn, hiện đoạn mã + nguồn dữ liệu sinh ra nó.
     Giúp người dùng hiểu ngay đổi ô nào thì phần nào của mã đổi theo. */
  .code-parts{
    display:flex; gap:2px; flex-wrap:wrap;
    margin-top:var(--s-3);
  }
  .cpart{
    flex:1 1 auto; min-width:66px;
    padding:var(--s-2) var(--s-2) var(--s-1);
    border:1px solid var(--n-300); border-radius:var(--r-sm);
    background:var(--n-000); text-align:center;
  }
  .cpart-key{
    font-size:11px; font-weight:var(--fw-semi); color:var(--n-400);
  }
  .cpart-seg{
    margin-top:2px;
    font-family:var(--font-mono);
    font-size:var(--fs-sm); font-weight:var(--fw-semi); color:var(--n-900);
    word-break:break-all; line-height:1.3;
  }
  .cpart-seg.empty{ color:var(--n-400); font-weight:var(--fw-normal); }
  .cpart-src{
    margin-top:2px; font-size:11px; line-height:1.25; color:var(--n-500);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* Đoạn SEQ — nhấn nhẹ vì đây là phần đảm bảo tính duy nhất */
  .cpart.seq{ background:var(--n-100); border-color:var(--n-400); }

  /* ══════════════════════════════════════════════════════
     BẢNG NHẬP CHI TIẾT THÙNG
     ══════════════════════════════════════════════════════
     Mỗi thẻ = 1 thùng, nhập tay số lượng thực tế. Tổng PHẢI khớp Số lượng —
     server chặn nếu lệch, nên dòng tổng đổi màu ngay khi gõ.
     ══════════════════════════════════════════════════════ */
  .box-grid{
    display:grid; gap:var(--s-2);
    grid-template-columns:repeat(auto-fill, minmax(104px, 1fr));
  }

  .bcell{
    padding:var(--s-2); border:1px solid var(--n-300);
    border-radius:var(--r-md); background:var(--n-000);
  }
  .bcell-no{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:var(--s-1);
  }
  .bcell-lbl{
    font-size:11px; font-weight:var(--fw-semi); color:var(--n-500);
  }
  .bcell-code{
    font-family:var(--font-mono);
    font-size:11px; color:var(--n-400);
  }
  .bcell input{
    height:32px; padding:0 var(--s-2);
    text-align:right; font-size:var(--fs-md); font-weight:var(--fw-semi);
  }
  /* Thùng chưa nhập số -> viền đỏ nhạt để thấy ngay còn ô trống */
  .bcell.empty{ border-color:var(--red-bd); background:var(--red-bg); }

  .box-total{
    display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap;
    margin-top:var(--s-3); padding:var(--s-2) var(--s-3);
    border-radius:var(--r-md); border:1px solid var(--n-300);
    background:var(--n-050);
    font-size:var(--fs-md); color:var(--n-700);
  }
  .box-total b{ font-weight:var(--fw-semi); }
  .box-total.ok{ border-color:var(--n-400); background:var(--n-100); }
  .box-total.bad{ border-color:var(--red-bd); background:var(--red-bg); color:var(--red); }

  .filters{
    display:flex; gap:var(--s-3); flex-wrap:wrap; align-items:flex-end;
    margin-bottom:var(--s-4);
  }

  /* ── Chế độ sửa ── */
  .editing{ border-color:var(--n-700) !important; background:var(--n-050); }
  .locked-row{
    display:flex; flex-wrap:wrap; gap:var(--s-2);
    margin-bottom:var(--s-3); padding-bottom:var(--s-3);
    border-bottom:1px dashed var(--n-300);
  }
  .locked-row .auto-cell{ background:var(--n-000); }

  /* ── Dải thông tin tự động ── */
  .auto-row{
    display:flex; flex-wrap:wrap; gap:var(--s-2);
    margin-top:var(--s-4); padding-top:var(--s-4); border-top:1px solid var(--n-200);
  }
  .auto-cell{
    flex:1 1 130px; min-width:120px;
    padding:var(--s-2) var(--s-3);
    border-radius:var(--r-md); background:var(--n-050);
  }
  .auto-cell span{
    display:block; font-size:11px; font-weight:var(--fw-semi); color:var(--n-400);
  }
  .auto-cell b{
    display:block; margin-top:2px;
    font-size:var(--fs-sm); font-weight:var(--fw-semi); word-break:break-word;
  }

  /* ── 2 nút chọn Import / Export ── */
  .seg{ display:flex; gap:var(--s-3); }
  .seg-btn{
    flex:1 1 0; max-width:250px;
    display:flex; align-items:center; gap:var(--s-3);
    padding:var(--s-4);
    border:1px solid var(--n-300); border-radius:var(--r-lg); background:var(--n-000);
    color:var(--n-700); font-size:var(--fs-base); font-family:inherit;
    font-weight:var(--fw-medium); text-align:left; cursor:pointer;
    transition:border-color .14s ease, background .14s ease, color .14s ease;
  }
  .seg-btn:hover{ border-color:var(--n-400); background:var(--n-025); }
  .seg-btn .ico{ width:20px; height:20px; color:var(--n-400); }

  /* Chọn rồi: viền đậm + nền xám, phân biệt In/Out bằng màu ICON */
  .seg-btn.on{
    border-color:var(--n-700); border-width:2px; background:var(--n-100);
    color:var(--n-900); font-weight:var(--fw-semi);
    padding:calc(var(--s-4) - 0px);
  }
  .seg-btn.on .ico{ color:var(--blue); }
  .seg-btn.on.out .ico{ color:var(--amber); }

  /* ══════════════════════════════════════════════════════
     BẢNG
     ══════════════════════════════════════════════════════ */
  .table-wrap{
    max-height:440px; overflow:auto;
    background:var(--n-000); border:1px solid var(--n-200);
    border-radius:var(--r-lg);
  }
  .table-wrap.tall{ max-height:520px; }
  .table-wrap.short{ max-height:300px; }

  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:var(--fs-md); }

  th, td{
    padding:var(--s-3);
    border-bottom:1px solid var(--n-100);
    text-align:left; white-space:nowrap; vertical-align:top;
  }
  th{
    position:sticky; top:0; z-index:2;
    background:var(--n-050); border-bottom:1px solid var(--n-200);
    color:var(--n-500); font-size:11px; font-weight:var(--fw-semi);
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--n-025); }

  tr.pick{ cursor:pointer; }
  /* Dòng đang chọn / cần chú ý: dải xám đậm bên trái, không tô nền màu */
  tr.sel{ background:var(--n-100) !important; box-shadow:inset 2px 0 0 var(--n-700); }
  tr.flag{ background:var(--n-050); box-shadow:inset 2px 0 0 var(--n-400); }

  td.num{ text-align:right; font-variant-numeric:tabular-nums; font-weight:var(--fw-medium); }
  td.wrap{ white-space:normal; min-width:180px; max-width:280px; }
  td.empty{ color:var(--n-400); font-style:italic; }

  .mono{
    font-family:var(--font-mono);
    font-size:var(--fs-sm); font-weight:var(--fw-medium); color:var(--n-700);
  }
  .cell-sub{
    margin-top:2px; font-size:var(--fs-xs);
    line-height:var(--lh-xs); color:var(--n-400);
  }
  .cell-variant{ color:var(--n-600); font-weight:var(--fw-medium); }

  .link{
    color:var(--n-900); font-weight:var(--fw-semi);
    border-bottom:1px dashed var(--n-400); cursor:pointer;
  }
  .link:hover{ color:var(--g-700); border-bottom-color:var(--g-500); }

  .tag-self{
    display:inline-block; margin-left:var(--s-1); padding:0px var(--s-2);
    border-radius:999px; background:var(--n-100); color:var(--n-500);
    font-size:11px; font-weight:var(--fw-medium);
  }

  .cell-actions{ display:flex; flex-direction:column; gap:var(--s-1); align-items:flex-start; }

  /* ══════════════════════════════════════════════════════
     BADGE
     ══════════════════════════════════════════════════════ */
  .badge{
    display:inline-flex; align-items:center; gap:var(--s-1);
    padding:2px var(--s-2); border-radius:var(--r-sm);
    border:1px solid transparent;
    font-size:var(--fs-xs); font-weight:var(--fw-semi); white-space:nowrap;
  }
  .badge.in{ background:var(--blue-bg); border-color:var(--blue-bd); color:var(--blue); }
  .badge.out{ background:var(--amber-bg); border-color:var(--amber-bd); color:var(--amber); }
  /* Còn hàng: xám đậm — không dùng xanh cho badge */
  .badge.ok{ background:var(--n-100); border-color:var(--n-300); color:var(--n-700); }
  .badge.warn{ background:var(--amber-bg); border-color:var(--amber-bd); color:var(--amber); }
  .badge.danger{ background:var(--red-bg); border-color:var(--red-bd); color:var(--red); }
  .badge.neutral{ background:var(--n-100); border-color:var(--n-200); color:var(--n-500); }
  .badge.pending{ background:var(--violet-bg); border-color:var(--violet-bd); color:var(--violet); }
  .badge.neg{ background:var(--neg); border-color:var(--neg); color:var(--n-000); }

  .reject-box{
    margin-top:var(--s-1); padding:var(--s-2) var(--s-3);
    border-radius:var(--r-sm); background:var(--red-bg); color:var(--red);
    font-size:var(--fs-xs); line-height:var(--lh-sm); white-space:normal;
  }
  .waiting{ color:var(--n-400); font-size:var(--fs-xs); font-style:italic; }

  /* ══════════════════════════════════════════════════════
     KPI
     ══════════════════════════════════════════════════════ */
  .kpis{
    display:grid; gap:var(--s-4); margin-bottom:var(--s-5);
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  }

  .kpi{
    padding:var(--s-4) var(--s-5);
    background:var(--n-000); border:1px solid var(--n-200);
    border-radius:var(--r-lg);
  }
  .kpi-head{ display:flex; align-items:center; gap:var(--s-2); color:var(--n-400); }
  .kpi-head .ico{ width:15px; height:15px; }
  .kpi-label{
    font-size:var(--fs-xs); font-weight:var(--fw-semi);
  }
  .kpi-value{
    margin-top:var(--s-2);
    font-size:var(--fs-num); line-height:1.15;
    font-weight:var(--fw-semi); letter-spacing:-.6px; color:var(--n-900);
  }
  .kpi-foot{ margin-top:2px; font-size:var(--fs-xs); color:var(--n-400); }

  /* Màu CHỈ ở icon và số, không tô nền -> giao diện điềm tĩnh.
     Bỏ tone 'accent' xanh; mặc định là xám đậm. */
  .kpi.blue   .kpi-head, .kpi.blue .kpi-value{ color:var(--blue); }
  .kpi.amber  .kpi-head, .kpi.amber .kpi-value{ color:var(--amber); }
  .kpi.red    .kpi-head, .kpi.red .kpi-value{ color:var(--red); }
  .kpi.violet .kpi-head, .kpi.violet .kpi-value{ color:var(--violet); }

  .kpi.tap{ cursor:pointer; transition:border-color .14s ease, background-color .14s ease; }
  .kpi.tap:hover{ border-color:var(--n-400); background:var(--n-025); }
  .kpi.tap .kpi-foot::after{ content:' →'; font-weight:var(--fw-semi); }

  /* ══════════════════════════════════════════════════════
     BIỂU ĐỒ
     ══════════════════════════════════════════════════════ */
  .chart-row{ display:flex; gap:var(--s-4); flex-wrap:wrap; margin-bottom:var(--s-5); }
  .chart-card{
    flex:1 1 320px; min-width:300px; padding:var(--s-5);
    background:var(--n-000); border:1px solid var(--n-200);
    border-radius:var(--r-lg);
  }
  .chart-wide{ flex:2 1 480px; min-width:380px; }
  .chart-narrow{ flex:1 1 290px; min-width:280px; }

  .chart-head{
    display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap;
    margin-bottom:var(--s-4);
  }
  .chart-title{ font-size:var(--fs-md); font-weight:var(--fw-semi); }
  .chart-head .chart-title{ flex:1; min-width:140px; }

  .tabs{ display:flex; gap:2px; padding:2px; border-radius:var(--r-md); background:var(--n-100); }
  .tab{
    padding:var(--s-1) var(--s-3); border:none; border-radius:var(--r-sm);
    background:transparent; color:var(--n-500);
    font-size:var(--fs-xs); font-family:inherit; font-weight:var(--fw-semi);
    white-space:nowrap; cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .tab:hover{ color:var(--n-900); }
  .tab.on{ background:var(--n-000); color:var(--n-900); }

  .line-wrap{ width:100%; overflow-x:auto; }
  .line-wrap svg{ display:block; width:100%; height:240px; min-width:380px; }
  .lc-grid{ stroke:var(--n-100); stroke-width:1; }
  .lc-axis{ stroke:var(--n-300); stroke-width:1; }
  .lc-label{ fill:var(--n-400); font-size:11px; }
  .lc-line{ fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .lc-dot{ stroke:var(--n-000); stroke-width:1.5; }

  .legend{
    display:flex; gap:var(--s-5); flex-wrap:wrap;
    margin-top:var(--s-3); font-size:var(--fs-sm);
  }
  .legend-item{ display:flex; align-items:center; gap:var(--s-2); color:var(--n-600); }
  .swatch{ width:10px; height:10px; border-radius:2px; flex-shrink:0; }

  .bar-row{
    display:flex; align-items:center; gap:var(--s-3);
    margin-bottom:var(--s-2); font-size:var(--fs-md);
