<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tồn kho theo user: số lượng đã request nhập, mặt hàng, điện thoại và SIM còn tồn.">
<title>POPS: Tồn kho theo user</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
  /* Hallmark · v2.0.0 · built: the project · redesign: polish · shape: app screen · theme: Grab (brand spec 2026-11-06) · genre: modern-minimal · posture: restrained */
  /* Hallmark · pre-emit critique: P3 H4 E4 S4 R4 V3 · weakest: P, a table page with no argument beyond clarity; polish fixed the tells and kept the layout */
  :root{
    --g:#00873b; --g-dk:#006a2f; --g-bg:#e9f6ef; --g-bd:#99e0b9;
    --n0:#fcfefd; --n25:#f8fbf9; --n50:#f3f6f4; --n100:#e9eeeb;
    --n200:#dbe3de; --n300:#c3cdc7; --n400:#5a6560; --n500:#4b4b4b;
    --n700:#2b3236; --n900:#161a1d;
    --amber:#b45309; --amber-bg:#fffbeb; --amber-bd:#fde68a;
    --red:#b91c1c; --red-bg:#fef2f2; --red-bd:#fecaca;
    --blue:#1d4ed8; --blue-bg:#eff6ff; --blue-bd:#bfdbfe;
    --r:8px; --r-lg:12px;
    --blue-sub:#3b6fd4; --brand:#00b14f;
    --font-body:"Inter",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    --font-mono:"Roboto Mono",ui-monospace,"SF Mono",Consolas,monospace;
    --sh:0 1px 2px rgba(16,24,40,.06);
    --sh-md:0 4px 12px rgba(16,24,40,.10);
  }
  *{ box-sizing:border-box; }
  html, body{ overflow-x:clip; }
  body{
    margin:0; padding:0; background:var(--n50); color:var(--n900);
    font-family:var(--font-body);
    font-size:14px; line-height:1.5;
  }
  div.wrap{ max-width:1400px; margin:0 auto; padding:24px 16px 48px; }

  /* ── Header ── */
  .hd{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:0 0 16px; }
  .hd-mark{
    width:38px; height:38px; flex-shrink:0; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--g); color:var(--n0); font-size:11px; font-weight:700;
  }
  .hd-t{ flex:1; min-width:180px; }
  .hd-t h1{ margin:0; font-size:17px; font-weight:600; letter-spacing:-.2px; text-wrap:balance; }
  .hd-t p{ margin:2px 0 0; font-size:12px; color:var(--n500); }
  .hd-me{ font-size:12px; color:var(--n500); text-align:right; }
  .hd-me b{ color:var(--n900); }

  /* ── KPI ── */
  .kpis{
    display:grid; gap:12px; margin-bottom:16px;
    grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
  }
  .kpi{
    padding:16px 16px; background:var(--n0);
    border:1px solid var(--n200); border-radius:var(--r-lg); box-shadow:var(--sh);
  }
  .kpi-l{
    font-size:11px; font-weight:600; color:var(--n400);
  }
  .kpi-v{ margin-top:8px; font-size:26px; line-height:1.1; font-weight:600; letter-spacing:-.6px; }
  .kpi-f{ margin-top:2px; font-size:11px; color:var(--n400); }
  .kpi.green .kpi-v{ color:var(--g-dk); }
  .kpi.blue  .kpi-v{ color:var(--blue); }
  .kpi.amber .kpi-v{ color:var(--amber); }

  /* ── Thanh công cụ ── */
  .bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 16px;
    background:var(--n0); border:1px solid var(--n200);
    border-bottom:none; border-radius:var(--r-lg) var(--r-lg) 0 0;
  }
  .bar h2{ margin:0; font-size:15px; font-weight:600; flex:1; min-width:130px; }
  input[type=text], select{
    padding:8px 12px; border:1px solid var(--n300); border-radius:var(--r);
    font-family:inherit; font-size:13px; color:var(--n900); background:var(--n0);
  }
  input[type=text]{ flex:0 1 230px; min-width:140px; }
  input[type=text]:focus, select:focus{ outline:2px solid var(--g-bd); border-color:var(--g); }
  .chk{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; color:var(--n700); cursor:pointer; user-select:none;
  }
  .btn{
    padding:8px 12px; border:1px solid var(--n300); border-radius:var(--r);
    background:var(--n0); color:var(--n700);
    font-family:inherit; font-size:13px; font-weight:500; cursor:pointer;
  }
  .btn:hover{ background:var(--n50); border-color:var(--n400); }
  a.btn{ display:inline-block; text-decoration:none; }
  a.btn[hidden]{ display:none; }
  /* thanh trên cùng: cùng kiểu với app chính (logo, tab gạch chân, người dùng ở bên phải) */
  .top{ background:var(--n0); border-bottom:1px solid var(--n200); }
  .top-in{ display:flex; align-items:stretch; gap:20px; max-width:1400px; margin:0 auto; padding:0 16px; min-height:56px; }
  .brand{ display:flex; align-items:center; gap:12px; color:var(--n900); text-decoration:none; font-weight:600; font-size:14px; }
  .brand .logo{ height:26px; width:auto; border-radius:6px; display:block; }
  .tabs{ display:flex; gap:4px; margin-left:8px; }
  .tab{
    display:flex; align-items:center; padding:0 12px; color:var(--n500); text-decoration:none; font-size:14px; font-weight:500;
    border-bottom:2px solid transparent; cursor:pointer;
  }
  .tab[hidden]{ display:none; }
  .tab:hover{ color:var(--n900); }
  .tab.on{ color:var(--n900); font-weight:600; border-bottom-color:var(--brand); }
  .top .hd-me{ margin-left:auto; align-self:center; padding:6px 0; line-height:1.35; }
  @media (max-width:700px){ .top .hd-me{ display:none; } .tabs{ margin-left:0; } }
  .btn.pri{ background:var(--g); border-color:var(--g); color:var(--n0); }
  .btn.pri:hover{ background:var(--g-dk); border-color:var(--g-dk); }
  .btn:active{ background:var(--n100); }
  .btn.pri:active{ background:var(--g-dk); border-color:var(--g-dk); }
  .btn:disabled{ background:var(--n50); color:var(--n500); border-color:var(--n200); cursor:not-allowed; }

  /* ── Hộp thông báo ── */
  .box{
    padding:12px 16px; font-size:13px; line-height:1.55;
    border:1px solid var(--n200); border-top:none; background:var(--n25);
  }
  .box.info{ background:var(--blue-bg); border-color:var(--blue-bd); color:var(--blue); }
  .box.err{ background:var(--red-bg); border-color:var(--red-bd); color:var(--red); }
  .box .sub{ margin-top:4px; font-size:11.5px; color:var(--blue-sub); }

  /* ── Bảng ── */
  .tw{
    overflow:auto; max-height:66vh; background:var(--n0);
    border:1px solid var(--n200); border-radius:0 0 var(--r-lg) var(--r-lg);
  }
  table{ width:100%; border-collapse:collapse; }
  th, td{
    padding:12px 12px; border-bottom:1px solid var(--n100);
    text-align:left; white-space:nowrap; vertical-align:top;
  }
  th{
    position:sticky; top:0; z-index:2;
    background:var(--n50); border-bottom:1px solid var(--n200);
    color:var(--n500); font-size:10.5px; font-weight:600;
    cursor:pointer; user-select:none;
  }
  th:hover{ background:var(--n100); color:var(--n900); }
  th .ar{ opacity:.35; font-size:9px; }
  th.on{ color:var(--g-dk); }
  th.on .ar{ opacity:1; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--n25); }
  tr.me{ background:var(--g-bg) !important; box-shadow:inset 2px 0 0 var(--g); }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td.wrap{ white-space:normal; min-width:150px; max-width:260px; }
  td.empty{ padding:28px 12px; color:var(--n400); font-style:italic; text-align:center; }
  .sub2{ margin-top:2px; font-size:11px; line-height:1.35; color:var(--n400); }
  .mono{ font-family:var(--font-mono); font-size:11.5px; color:var(--g-dk); }
  .big{ font-size:15px; font-weight:600; }
  .zero{ color:var(--n400); }
  .tag{
    display:inline-block; margin-left:8px; padding:0px 8px; border-radius:9px;
    background:var(--n100); color:var(--n700); font-size:11px; font-weight:500;
  }
  .tag.me{ background:var(--g); color:var(--n0); }
  .tag.ad{ background:var(--n200); color:var(--n700); }
  .pill{
    display:inline-block; padding:0px 8px; border-radius:var(--r);
    border:1px solid var(--amber-bd); background:var(--amber-bg);
    color:var(--amber); font-size:10.5px; font-weight:600;
  }
  .foot{ margin-top:12px; font-size:11.5px; color:var(--n400); text-align:center; }

  /* ── Hộp CSV ── */
  .ov{
    position:fixed; inset:0; z-index:900; display:none;
    padding:32px 16px; overflow:auto; background:color-mix(in srgb, var(--n900) 55%, transparent);
  }
  .ov.on{ display:block; }
  .ov-c{
    max-width:860px; margin:0 auto; padding:20px;
    background:var(--n0); border-radius:var(--r-lg); box-shadow:var(--sh-md);
  }
  .ov-h{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .ov-h h3{ margin:0; flex:1; min-width:200px; font-size:15px; font-weight:600; }
  textarea{
    width:100%; height:300px; padding:12px;
    border:1px solid var(--n300); border-radius:var(--r);
    font-family:var(--font-mono); font-size:11.5px; resize:vertical;
  }

  @media (max-width:640px){
    .hd-me{ text-align:left; width:100%; }
    .tw{ max-height:none; }
    input[type=text], select{ font-size:16px; }      /* chặn iOS tự zoom */
    input[type=text]{ flex:1 1 100%; }
  }
</style>
</head>

<script>
  /* ══════════════════════════════════════════════════════════════
     Popshtml.html — TRANG QUẢN LÝ RIÊNG CỦA POPS
     ══════════════════════════════════════════════════════════════
     Trang độc lập: CSS + JS riêng, KHÔNG dùng App.html / Styles.html.
     Toàn bộ số liệu do server tính trong popsGetUsers() (Pops.gs).

     "Mặt hàng còn tồn" = SỐ MÃ HÀNG user đó đã nhập mà hiện còn tồn > 0.
     "Điện thoại" / "SIM" = SỐ LƯỢNG còn tồn thuộc 2 nhóm đó, không có = 0.
     ══════════════════════════════════════════════════════════════ */

  let DATA = null;                        // kết quả popsGetUsers()
  let SORT = { key: 'itemsHeld', dir: -1 };

  const COLS = [
    { key:'username',      label:'Tên user',            type:'txt' },
    { key:'email',         label:'Email',               type:'txt' },
    { key:'department',    label:'Team',                type:'txt' },
    { key:'reqQty',        label:'SL đã request nhập',  type:'num' },
    { key:'itemsImported', label:'Mặt hàng đã nhập',    type:'num' },
    { key:'itemsHeld',     label:'Mặt hàng còn tồn',    type:'num' },
    { key:'phoneQty',      label:'Điện thoại',          type:'num' },
    { key:'simQty',        label:'SIM',                 type:'num' }
  ];

  /* ── Tiện ích ── */
  function el(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function num(n){ return (Number(n) || 0).toLocaleString('vi-VN'); }
  function box(id, html, cls){
    const e = el(id);
    e.className = 'box' + (cls ? ' ' + cls : '');
    e.innerHTML = html;
  }

  /* ── Nạp dữ liệu ── */
  function load() {
    box('info', 'Đang tải dữ liệu…');
    el('tbl').innerHTML = '';

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          box('info', esc((res && res.message) || 'Có lỗi xảy ra.'), 'err');
          el('meBox').innerHTML = res && res.denied ? '<b>Không có quyền</b>' : '<b>—</b>';
          return;
        }
        DATA = res;
        if (res.homeUrl) { const hb = el('homeBtn'); hb.href = res.homeUrl; hb.hidden = false; el('homeBrand').href = res.homeUrl; }
        el('meBox').innerHTML =
          '<b>' + esc(res.me.username) + '</b><br>' + esc(res.me.email) +
          '<br>' + esc(res.me.cc) + ' · ' + esc(res.me.role);
        el('foot').textContent = 'Số liệu tính lúc ' + res.generatedAt +
          ' · nguồn: sheet Team, Database, PendingRequests';
        fillCc();
        renderKpis();
        render();
      })
      .withFailureHandler(function (e) {
        box('info', 'Không gọi được server: ' + esc(e.message || e), 'err');
      })
      .popsGetUsers();
  }

  function fillCc() {
    const sel = el('ccSel');
    const keep = sel.value;
    const seen = {}, list = [];

    (DATA.rows || []).forEach(function (r) {
      if (r.cc && !seen[r.cc]) { seen[r.cc] = 1; list.push(r.cc); }
    });
    list.sort();

    sel.innerHTML = '<option value="">Tất cả Cost Center</option>';
    list.forEach(function (cc) {
      const o = document.createElement('option');
      o.value = cc; o.textContent = cc;
      sel.appendChild(o);
    });
    if (keep) sel.value = keep;
  }

  function kpi(tone, label, value, foot) {
    return '<div class="kpi ' + tone + '">' +
      '<div class="kpi-l">' + label + '</div>' +
      '<div class="kpi-v">' + value + '</div>' +
      '<div class="kpi-f">' + foot + '</div></div>';
  }

  function renderKpis() {
    const s = DATA.summary;
    el('kpis').innerHTML =
      kpi('',      'Tổng user',          num(s.users),        'trong sheet Team') +
      kpi('green', 'User còn giữ hàng',  num(s.withStock),    'có ít nhất 1 mặt hàng tồn') +
      kpi('blue',  'Mặt hàng còn tồn',   num(s.itemsHeld),    'tổng trên mọi user') +
      kpi('',      'Điện thoại còn tồn', num(s.phoneQty || 0), 'số lượng') +
      kpi('',      'SIM còn tồn',        num(s.simQty || 0),   'số lượng') +
      kpi(s.pending ? 'amber' : '', 'Yêu cầu chờ duyệt', num(s.pending), 'trạng thái PENDING');
  }

  /* ── Lọc + sắp xếp ── */
  function visibleRows() {
    if (!DATA) return [];

    const q    = (el('find').value || '').trim().toLowerCase();
    const cc   = el('ccSel').value;
    const only = el('onlyStock').checked;

    const rows = (DATA.rows || []).filter(function (r) {
      if (cc && r.cc !== cc) return false;
      if (only && !r.itemsHeld) return false;
      if (!q) return true;
      return (r.username + ' ' + r.email + ' ' + r.cc + ' ' + r.department)
        .toLowerCase().indexOf(q) !== -1;
    });

    const k = SORT.key, d = SORT.dir;
    const isNum = (COLS.filter(function (c) { return c.key === k; })[0] || {}).type === 'num';

    rows.sort(function (a, b) {
      if (isNum) {
        const x = Number(a[k]) || 0, y = Number(b[k]) || 0;
        if (x !== y) return (x - y) * d;
        return a.username.localeCompare(b.username, 'vi');
      }
      return String(a[k] || '').localeCompare(String(b[k] || ''), 'vi') * d;
    });

    return rows;
  }

  function setSort(key) {
    const col = COLS.filter(function (c) { return c.key === key; })[0] || {};
    if (SORT.key === key) SORT.dir = -SORT.dir;
    else SORT = { key: key, dir: col.type === 'num' ? -1 : 1 };
    render();
  }

  /* ── Vẽ bảng ── */
  function cellQty(n) {
    return n ? '<span class="big">' + num(n) + '</span>' : '<span class="zero">0</span>';
  }

  function render() {
    if (!DATA) return;

    const rows = visibleRows();
    const s = DATA.summary;

    let info = 'Sheet Team có <b>' + num(s.users) + '</b> user · bạn thuộc <b>' +
               esc(DATA.me.cc) + '</b> nên xem được <b>toàn bộ Cost Center</b>';
    if (rows.length !== s.users) info += ' · đang hiện <b>' + num(rows.length) + '</b>';

    box('info', info + '<div class="sub">Mặt hàng còn tồn = số mã hàng user đó đã nhập và ' +
        'hiện còn tồn &gt; 0. Điện thoại / SIM = số lượng còn tồn thuộc 2 nhóm đó, ' +
        'nhận diện theo Category + Sub-Category. Tồn tính theo mã hàng trong ' +
        'Cost Center, đã trừ mọi lần xuất của cả team.</div>', 'info');

    const tbl = el('tbl');
    tbl.innerHTML = '';

    /* thead */
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    COLS.forEach(function (c) {
      const th = document.createElement('th');
      const on = SORT.key === c.key;
      th.className = on ? 'on' : '';
      th.innerHTML = c.label + ' <span class="ar">' +
        (on ? (SORT.dir === 1 ? '▲' : '▼') : '▲▼') + '</span>';
      th.onclick = function () { setSort(c.key); };
      if (c.type === 'num') th.style.textAlign = 'right';
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    tbl.appendChild(thead);

    /* tbody */
    const tb = document.createElement('tbody');

    if (!rows.length) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = COLS.length;
      td.className = 'empty';
      td.textContent = 'Không có user nào khớp bộ lọc.';
      tr.appendChild(td);
      tb.appendChild(tr);
    } else {
      rows.forEach(function (r) {
        const tr = document.createElement('tr');
        if (r.isSelf) tr.className = 'me';

        tr.innerHTML =
          '<td class="wrap">' + esc(r.username) +
            (r.isSelf ? '<span class="tag me">Bạn</span>' : '') +
            (r.role === 'admin' ? '<span class="tag ad">admin</span>' : '') + '</td>' +
          '<td class="wrap">' + esc(r.email) + '</td>' +
          '<td class="wrap">' + esc(r.department) +
            '<div class="sub2 mono">' + esc(r.cc) + '</div></td>' +
          '<td class="num">' + (r.reqQty ? num(r.reqQty) : '<span class="zero">—</span>') +
            '<div class="sub2">' + num(r.reqCount) + ' yêu cầu' +
              (r.approvedQty ? ' · duyệt ' + num(r.approvedQty) : '') +
              (r.reqPending ? ' · <span class="pill">' + num(r.reqPending) + ' chờ</span>' : '') +
            '</div></td>' +
          '<td class="num">' + (r.itemsImported
              ? num(r.itemsImported) + '<div class="sub2">SL ' + num(r.impQty) + '</div>'
              : '<span class="zero">—</span>') + '</td>' +
          '<td class="num">' + (r.itemsHeld
              ? '<span class="big">' + num(r.itemsHeld) + '</span>' +
                '<div class="sub2">SL tồn ' + num(r.heldQty) + '</div>'
              : '<span class="zero big">0</span>') + '</td>' +
          '<td class="num">' + cellQty(r.phoneQty) + '</td>' +
          '<td class="num">' + cellQty(r.simQty) + '</td>';

        tb.appendChild(tr);
      });
    }

    tbl.appendChild(tb);
  }

  /* ── CSV ── */
  function openCsv() {
    if (!DATA) return;

    const q = function (v) {
      const s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.split('"').join('""') + '"' : s;
    };

    const lines = [['Tên user','Email','Cost Center','Team','Vai trò',
                    'SL đã request nhập','Trong đó đã duyệt','Số yêu cầu','Chờ duyệt',
                    'Mặt hàng đã nhập','Tổng SL đã nhập',
                    'Mặt hàng còn tồn','Tổng SL còn tồn',
                    'Điện thoại','SIM'].join(',')];

    visibleRows().forEach(function (r) {
      lines.push([q(r.username), q(r.email), q(r.cc), q(r.department), q(r.role),
                  r.reqQty, r.approvedQty, r.reqCount, r.reqPending,
                  r.itemsImported, r.impQty, r.itemsHeld, r.heldQty,
                  r.phoneQty || 0, r.simQty || 0].join(','));
    });

    el('csvTa').value = lines.join('\n');
    el('csvOv').classList.add('on');
    el('csvTa').select();
  }

  function closeCsv(ev) {
    if (ev && ev.target && ev.target.id !== 'csvOv') return;
    el('csvOv').classList.remove('on');
  }

  function copyCsv() {
    el('csvTa').select();
    try { document.execCommand('copy'); } catch (e) {}
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') el('csvOv').classList.remove('on');
  });

  window.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
