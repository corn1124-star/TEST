<style>
  /* ══ ĐĂNG KÝ / CHỜ DUYỆT — phủ lên màn hình landing ══ */
  .reg-ov{
    position:fixed; inset:0; z-index:10000; display:none; overflow-y:auto;
    padding:32px 16px; background:var(--n-050);
  }
  .reg-ov.on{ display:block; }
  .reg-card{
    max-width:460px; margin:6vh auto 0; padding:28px 24px;
    background:var(--n-000); border:1px solid var(--n-200); border-radius:var(--r-lg);
    box-shadow:0 12px 32px color-mix(in srgb, var(--n-900) 10%, transparent);
    font-family:var(--font-body);
    color:var(--n-900);
  }
  .reg-card h2{ margin:0 0 4px; font-size:19px; font-weight:600; }
  .reg-sub{ margin:0 0 20px; font-size:13px; color:var(--n-500); line-height:1.5; }
  .reg-f{ display:flex; flex-direction:column; gap:4px; margin-bottom:16px; }
  .reg-f label{ font-size:12px; font-weight:600; color:var(--n-700); }
  .reg-f input, .reg-f select{
    height:40px; padding:0 12px; border:1px solid var(--n-300); border-radius:var(--r-sm);
    font-family:inherit; font-size:15px; color:var(--n-900); background:var(--n-000);
  }
  .reg-f input:focus, .reg-f select:focus{ outline:2px solid var(--g-100); border-color:var(--g-600); }
  .reg-f input[readonly]{ background:var(--n-100); color:var(--n-500); }
  .reg-team{
    display:none; margin:-4px 0 16px; padding:12px 12px;
    border:1px dashed var(--g-100); border-radius:var(--r-sm); background:var(--g-050);
    font-size:13px; color:var(--g-700);
  }
  .reg-team.on{ display:block; }
  .reg-team b{ font-family:var(--font-mono); font-size:14px; }
  .reg-btn{
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    height:42px; border:none; border-radius:var(--r-sm); background:var(--g-600); color:var(--n-000);
    font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;
    text-decoration:none;
  }
  .reg-btn:hover{ background:var(--g-700); }
  .reg-btn:disabled{ opacity:.55; cursor:not-allowed; }
  .reg-btn.ghost{ background:var(--n-000); color:var(--n-700); border:1px solid var(--n-300); margin-top:8px; }
  .reg-err{ margin-top:12px; padding:12px 12px; border-radius:var(--r-sm);
            background:var(--red-bg); color:var(--red); font-size:13px; }
  .reg-info{ width:100%; border-collapse:collapse; margin:16px 0 20px; font-size:13px; }
  .reg-info td{ padding:8px 0; border-bottom:1px solid var(--n-100); }
  .reg-info td:first-child{ color:var(--n-500); width:110px; }
  .reg-badge{ display:inline-block; padding:4px 12px; border-radius:20px;
              background:var(--amber-bg); color:var(--amber); font-size:12px; font-weight:600; }

  /* ══ KHỐI DUYỆT USER Ở TRANG QUẢN TRỊ ══
     Bảng dùng giao diện chung (.table-wrap.rt: thẻ ở ≤640px); chỉ chỉnh những gì khối này cần.
     Nút lấy cỡ/chạm từ lớp .btn toàn cục — không đặt min-height riêng. */
  .reg-admin th{ font-size:var(--fs-sm); text-transform:none; letter-spacing:0; }
  .reg-admin .mono{ font-family:var(--font-mono); font-size:12px; }
  .reg-admin .cell-actions.acts{ flex-direction:row; flex-wrap:wrap; gap:8px; }
</style>

<script>
/* ══════════════════════════════════════════════════════════════
   RegisterUI.html — FORM ĐĂNG KÝ · MÀN HÌNH CHỜ DUYỆT · KHỐI DUYỆT USER
   Include SAU App.html. Không sửa App.html:
     · bọc landError() -> bootstrapAll trả '__NEED_REGISTER__' / '__PENDING__'
       thì hiện form đăng ký / màn hình chờ, thay vì báo lỗi;
     · bọc goto() -> vào trang Quản trị thì nạp danh sách user chờ duyệt.
   ══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var REG = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ══ 1. MÀN HÌNH ĐĂNG KÝ / CHỜ DUYỆT ══ */
  function show(html) {
    var ov = $('regOv');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'regOv';
      ov.className = 'reg-ov';
      ov.innerHTML = '<div class="reg-card" id="regCard"></div>';
      document.body.appendChild(ov);
    }
    ov.classList.add('on');
    $('regCard').innerHTML = html;
  }

  function load() {
    show('<p class="reg-sub">Đang kiểm tra tài khoản…</p>');

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          show('<h2>Không xác định được tài khoản</h2>' +
               '<div class="reg-err">' + esc((res && res.message) || 'Có lỗi xảy ra.') + '</div>');
          return;
        }
        REG = res;
        if (res.status === 'register') renderForm();
        else if (res.status === 'pending') renderPending();
        else renderActive();
      })
      .withFailureHandler(function (e) {
        show('<h2>Không kết nối được máy chủ</h2>' +
             '<div class="reg-err">' + esc(e && e.message || e) + '</div>');
      })
      .getRegisterInfo();
  }

  function renderForm() {
    var opts = (REG.departments || []).map(function (d) {
      return '<option value="' + esc(d.cc) + '">' + esc(d.name) + ' · ' + esc(d.cc) + '</option>';
    }).join('');

    show(
      '<h2>Đăng ký tài khoản</h2>' +
      '<p class="reg-sub">Tài khoản của bạn chưa có trong hệ thống. Điền thông tin dưới đây, ' +
        'quản trị viên sẽ duyệt trước khi bạn sử dụng được ứng dụng.</p>' +
      '<div class="reg-f"><label for="regName">Tên của bạn</label>' +
        '<input id="regName" type="text" maxlength="60" placeholder="vd: an.dinh"></div>' +
      '<div class="reg-f"><label for="regMail">Email</label>' +
        '<input id="regMail" type="text" readonly value="' + esc(REG.email) + '"></div>' +
      '<div class="reg-f"><label for="regDept">Team</label>' +
        '<select id="regDept"><option value="">— Chọn team —</option>' + opts + '</select></div>' +
      '<div class="reg-team" id="regTeam"></div>' +
      '<button type="button" class="reg-btn" id="regSubmit">Gửi đăng ký</button>' +
      '<div id="regMsg"></div>'
    );

    $('regDept').onchange = function () {
      var d = (REG.departments || []).filter(function (x) { return x.cc === $('regDept').value; })[0];
      var box = $('regTeam');
      if (!d) { box.classList.remove('on'); return; }
      box.innerHTML = 'Cost Center: <b>' + esc(d.cc) + '</b> &nbsp;·&nbsp; Team code: <b>' +
                      esc(d.team) + '</b>';
      box.classList.add('on');
    };

    $('regSubmit').onclick = submit;
  }

  function submit() {
    var name = ($('regName').value || '').trim();
    var cc = $('regDept').value;
    var msg = $('regMsg');

    if (!name) { msg.innerHTML = '<div class="reg-err">Vui lòng nhập tên của bạn.</div>'; return; }
    if (!cc)   { msg.innerHTML = '<div class="reg-err">Vui lòng chọn team.</div>'; return; }

    var btn = $('regSubmit');
    btn.disabled = true;
    btn.textContent = 'Đang gửi…';

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          btn.disabled = false;
          btn.textContent = 'Gửi đăng ký';
          msg.innerHTML = '<div class="reg-err">' + esc((res && res.message) || 'Có lỗi xảy ra.') + '</div>';
          return;
        }
        load();   // -> màn hình chờ duyệt
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        btn.textContent = 'Gửi đăng ký';
        msg.innerHTML = '<div class="reg-err">' + esc(e && e.message || e) + '</div>';
      })
      .registerSelf({ username: name, cc: cc });
  }

  function renderPending() {
    show(
      '<h2>Đang chờ duyệt</h2>' +
      '<p class="reg-sub">Đăng ký của bạn đã được gửi. Quản trị viên sẽ duyệt và bạn sẽ nhận ' +
        'email khi tài khoản được kích hoạt.</p>' +
      '<span class="reg-badge">Chờ quản trị viên duyệt</span>' +
      '<table class="reg-info">' +
        '<tr><td>Tên</td><td><b>' + esc(REG.username) + '</b></td></tr>' +
        '<tr><td>Email</td><td>' + esc(REG.email) + '</td></tr>' +
        '<tr><td>Team</td><td>' + esc(REG.department) + '</td></tr>' +
        '<tr><td>Cost Center</td><td>' + esc(REG.cc) + '</td></tr>' +
        '<tr><td>Team code</td><td><b>' + esc(REG.teamCode) + '</b></td></tr>' +
      '</table>' +
      '<button type="button" class="reg-btn ghost" id="regRecheck">Kiểm tra lại</button>'
    );
    $('regRecheck').onclick = load;
  }

  function renderActive() {
    show(
      '<h2>Tài khoản đã được duyệt</h2>' +
      '<p class="reg-sub">Bạn đã có thể sử dụng ứng dụng.</p>' +
      (REG.url
        ? '<a class="reg-btn" href="' + esc(REG.url) + '" target="_top">Vào ứng dụng</a>'
        : '<p class="reg-sub">Hãy tải lại trang.</p>')
    );
  }

  /* ══ 2. KHỐI DUYỆT USER Ở TRANG QUẢN TRỊ ══ */
  Object.assign(I18N.vi, {
    'reg.pendingTitle':'User chờ duyệt', 'reg.colName':'Tên / Email', 'reg.colTeam':'Team · CC', 'reg.colCode':'Team code',
    'reg.approveTitle':'Duyệt tài khoản', 'reg.approveBody':'Duyệt tài khoản {email}?\nTeam {team} · CC {cc}',
    'reg.rejectTitle':'Từ chối tài khoản', 'reg.rejectBody':'Từ chối đăng ký của {email}?\nTeam {team} · CC {cc}'
  });
  Object.assign(I18N.en, {
    'reg.pendingTitle':'Users awaiting approval', 'reg.colName':'Name / Email', 'reg.colTeam':'Team · CC', 'reg.colCode':'Team code',
    'reg.approveTitle':'Approve account', 'reg.approveBody':'Approve the account for {email}?\nTeam {team} · CC {cc}',
    'reg.rejectTitle':'Reject account', 'reg.rejectBody':'Reject the registration of {email}?\nTeam {team} · CC {cc}'
  });

  var PEND = null;      // kết quả getPendingUsers gần nhất (để vẽ lại khi đổi ngôn ngữ)
  var PEND_NOTE = null; // { text, ok } kết quả duyệt/từ chối gần nhất, hiện lại sau khi tải lại danh sách

  function adminCard() {
    var page = $('page-admin');
    if (!page) return null;

    var c = $('regAdmin');
    if (c) return c;

    c = document.createElement('div');
    c.id = 'regAdmin';
    c.className = 'card reg-admin';
    c.hidden = true;

    var anchor = page.querySelector('.page-sub') || page.querySelector('.page-title');
    if (anchor && anchor.parentNode === page) page.insertBefore(c, anchor.nextSibling);
    else page.insertBefore(c, page.firstChild);
    return c;
  }

  function loadPendingUsers() {
    if (typeof IS_ADMIN !== 'undefined' && !IS_ADMIN) return;

    google.script.run
      .withSuccessHandler(function (res) { PEND = res; renderPendingUsers(res); })
      .withFailureHandler(function () {})
      .getPendingUsers();
  }

  function renderPendingUsers(res) {
    var c = adminCard();
    if (!c) return;

    if (!res || !res.ok || !res.rows.length) { c.hidden = true; c.innerHTML = ''; return; }

    // 4 <td> khớp 1:1 với 4 <th>; cột cuối chỉ có nút (bảng .rt thành thẻ ở ≤640px)
    var body = res.rows.map(function (u, i) {
      return '<tr>' +
        '<td><b>' + esc(u.username) + '</b><div class="cell-sub">' + esc(u.email) + '</div></td>' +
        '<td>' + esc(u.department) + '<div class="cell-sub mono">' + esc(u.cc) + '</div></td>' +
        '<td class="mono"><b>' + esc(u.teamCode) + '</b></td>' +
        '<td><div class="cell-actions acts">' +
          '<button type="button" class="btn sm" data-i="' + i + '" data-a="ok">' + esc(t('act.approve')) + '</button>' +
          '<button type="button" class="btn ghost sm danger" data-i="' + i + '" data-a="no">' + esc(t('act.reject')) + '</button>' +
        '</div></td></tr>';
    }).join('');

    c.hidden = false;
    c.innerHTML =
      '<h3 class="sec-title">' + esc(t('reg.pendingTitle')) + ' <span class="sec-count">' + res.rows.length + '</span></h3>' +
      '<div class="box" id="regAdminMsg" hidden></div>' +
      '<div class="table-wrap rt"><table><thead><tr><th>' + esc(t('reg.colName')) + '</th><th>' + esc(t('reg.colTeam')) + '</th>' +
        '<th>' + esc(t('reg.colCode')) + '</th><th></th></tr></thead><tbody>' + body + '</tbody></table></div>';

    if (PEND_NOTE) {
      var box = $('regAdminMsg');
      box.hidden = false;
      box.className = 'box ' + (PEND_NOTE.ok ? 'ok' : 'err');
      box.textContent = PEND_NOTE.text;
    }

    c.querySelectorAll('button[data-a]').forEach(function (b) {
      b.onclick = function () {
        var u = res.rows[Number(b.getAttribute('data-i'))];
        decide(u, b.getAttribute('data-a') === 'ok', b);
      };
    });
  }

  function decide(u, approve, btn) {
    var info = { email: u.email, team: u.teamCode, cc: u.cc };

    // Hộp thoại dùng chung (app/Dialog.html): duyệt = xác nhận; từ chối = lý do không bắt buộc, nút đỏ
    uiDialog(approve
      ? { title: t('reg.approveTitle'), body: t('reg.approveBody', info), okLabel: t('act.approve') }
      : { title: t('reg.rejectTitle'), body: t('reg.rejectBody', info), reason: 'optional', okLabel: t('act.reject'), danger: true },
    function (reason) {
      btn.disabled = true;

      var done = function (res) {
        var ok = !!(res && res.ok);
        var text = (res && res.message) || t('msg.error');
        PEND_NOTE = { text: text, ok: ok };
        if (typeof toast === 'function') toast(text, ok ? undefined : 'err');
        loadPendingUsers();
        if (typeof loadUsers === 'function') loadUsers();
      };

      var run = google.script.run.withSuccessHandler(done)
        .withFailureHandler(function (e) { done({ ok: false, message: String(e && e.message || e) }); });

      if (approve) run.approveUser(u.rowIndex, u.email);
      else run.rejectUser(u.rowIndex, u.email, reason);
    });
  }

  /* ══ 3. GẮN VÀO App.html ══ */
  if (typeof window.landError === 'function') {
    var _landError = window.landError;
    window.landError = function (msg) {
      var m = String(msg || '');
      if (m.indexOf('__NEED_REGISTER__') !== -1 || m.indexOf('__PENDING__') !== -1) {
        load();
        return;
      }
      return _landError.apply(this, arguments);
    };
  }

  if (typeof window.applyI18n === 'function') {
    var _apply = window.applyI18n;
    window.applyI18n = function () {
      var out = _apply.apply(this, arguments);
      if (PEND) renderPendingUsers(PEND);     // khối User chờ duyệt vẽ bằng JS: dịch lại theo ngôn ngữ mới
      return out;
    };
  }

  if (typeof window.goto === 'function') {
    var _goto = window.goto;
    window.goto = function (p) {
      var out = _goto.apply(this, arguments);
      if (p === 'admin') { PEND_NOTE = null; loadPendingUsers(); }
      return out;
    };
  }
})();
</script>
